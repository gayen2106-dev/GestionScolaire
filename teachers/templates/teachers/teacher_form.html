{% extends "base.html" %}

{% block title %}{{ title }} · School Manager{% endblock %}

{% block content %}
    <h1>{{ title }}</h1>

    <form method="post" class="card form-card">
        {% csrf_token %}
        {{ form.non_field_errors }}

        {% for field in form %}
            <div class="field{% if field.errors %} has-error{% endif %}">
                {{ field.label_tag }}
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}

        <div class="form-actions">
            <button type="submit">Enregistrer</button>
            <a class="btn btn-secondary" href="{% url 'teachers:list' %}">Annuler</a>
        </div>
    </form>
{% endblock %}
